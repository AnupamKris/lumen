# Lumen notification theme (mako)
font=Inter 10
background-color=#232529f2
text-color=#e8e8ea
border-color=#ffffff1a
border-size=1
border-radius=12
padding=12,14
outer-margin=6
margin=6
width=360
height=160
icons=1
max-icon-size=40
default-timeout=5000
max-visible=4
layer=overlay
anchor=top-right
progress-color=over #8ab4f8

[urgency=low]
text-color=#c9cbd1

[urgency=high]
border-color=#f28b82
default-timeout=0
