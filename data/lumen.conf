# Lumen configuration — ~/.config/lumen/lumen.conf
# Reload with Super+Shift+R. Lines are "key = value"; '#' starts a comment.

# ---- apps ----
terminal = foot
launcher = fuzzel

# Started once when the session begins.
autostart = lumen-panel
autostart = mako
# Lock after 5 min idle, screen off after 10, lock before suspend.
autostart = swayidle -w timeout 300 'lumen-lock' timeout 600 'lumen --msg "dpms off"' resume 'lumen --msg "dpms on"' before-sleep 'lumen-lock'
# Desktop portals (screen sharing, file pickers) need to know the desktop.
autostart = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE LUMEN_SOCK

# ---- keyboard ----
# kb_layout = us
# kb_variant =
# kb_options = caps:escape
repeat_rate = 30
repeat_delay = 300

# ---- look ----
# wallpaper = ~/Pictures/wallpaper.jpg
font = Inter 10
corner_radius = 10
border_width = 1
titlebar_height = 32
gaps = 8
shadows = true
shadow_size = 30
blur = true
animations = true

# Colours: #rrggbb or #rrggbbaa
accent = #8ab4f8
background = #1c1d21
title_bg = #2a2c31
title_bg_inactive = #232529
title_fg = #e8e8ea
title_fg_inactive = #8a8d94
border = #ffffff1a
border_inactive = #ffffff0d
shadow_color = #00000080

# ---- tiling ----
# Workspaces start floating; Super+T toggles tiling per workspace.
tiling = false
master_ratio = 0.55

# ---- key bindings ----
# bind = MODS+Key action      (action "none" removes a default)
# Actions: exec <cmd>, exec-terminal, exec-launcher, close, fullscreen,
#   maximize, minimize, toggle-floating, toggle-tiling, focus next|prev,
#   master +0.05|-0.05, swap-master, workspace N, move-to N, reload, exit,
#   dpms on|off
#
# Defaults:
#   Super+Return terminal        Super+D / Super+Space launcher
#   Super+Q close                Super+F fullscreen   Super+M maximize
#   Super+N minimize             Super+V float window Super+T tile workspace
#   Super+J/K, Alt+Tab focus     Super+[ / ] master size
#   Super+Shift+Return swap with master
#   Super+1..9 workspace         Super+Shift+1..9 move window there
#   Super+L lock                 Super+Escape session menu
#   Print screenshot             Shift+Print region screenshot
#   Super+Shift+R reload         Super+Shift+E log out
#   Super+drag move, Super+right-drag resize
#
# Examples:
# bind = SUPER+B exec firefox
# bind = SUPER+E exec thunar
