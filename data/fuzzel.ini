# Lumen launcher theme: neutral dark, matches window chrome.
[main]
font=Inter:size=11
prompt="  "
icon-theme=Adwaita
icons-enabled=yes
lines=8
width=36
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=28
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1c1d21f2
text=c9cbd1ff
prompt=8a8d94ff
placeholder=6b6e75ff
input=e8e8eaff
match=8ab4f8ff
selection=2e3036ff
selection-text=f2f2f4ff
selection-match=8ab4f8ff
border=ffffff1a

[border]
width=1
radius=12

[dmenu]
exit-immediately-if-empty=yes
